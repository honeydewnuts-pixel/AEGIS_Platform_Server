name: Build, Sign, Notarize & Release (macOS)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number for the tag (v{date}-{build_number})"
        required: true
        default: "01"

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: macos-14
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get short commit hash + tag
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=v$(date -u +%Y-%m-%d)-${{ github.event.inputs.build_number }}" >> "$GITHUB_OUTPUT"
          # Strip the leading "v" and date dashes for a plain semver-ish CFBundleShortVersionString
          echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Import the Developer ID signing certificate into a temporary
      # keychain. Requires these repo secrets:
      #   MACOS_CERT_P12_BASE64   - Developer ID Application cert, base64-encoded .p12
      #   MACOS_CERT_PASSWORD     - the .p12 password
      #   MACOS_SIGNING_IDENTITY  - e.g. "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_TEAM_ID           - your Apple Developer Team ID
      #   APPLE_ID                - Apple ID for notarization
      #   APPLE_APP_SPECIFIC_PASSWORD - app-specific password for that Apple ID
      # If MACOS_CERT_P12_BASE64 is absent, the build proceeds ad-hoc
      # signed only (fine for testing, not for distribution).
      # ------------------------------------------------------------------
      - name: Import signing certificate
        if: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Warn if unsigned
        if: ${{ env.MACOS_CERT_P12_BASE64 == '' }}
        run: echo "::warning::MACOS_CERT_P12_BASE64 secret not set - building ad-hoc signed only. Gatekeeper will reject this .dmg on any other Mac."

      - name: Build (+ sign if configured)
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Notarize + staple
        if: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          # build.sh already notarizes+staples if all four Apple env
          # vars were present during the build step above. This step is
          # a safety net that reruns notarization only if that didn't
          # happen for some reason (e.g. secrets added after build.sh
          # already ran in a cached/local context) - normally a no-op.
          DMG="AEGIS_Capture_v${VERSION}.dmg"
          if ! xcrun stapler validate "$DMG" 2>/dev/null; then
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
            xcrun stapler staple "$DMG"
          fi

      - name: Rename output to requested naming
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          mkdir -p release_out
          cp "AEGIS_Capture_v${VERSION}.dmg" "release_out/AegisCapture-Mac.dmg"
          # Also extract the raw .app bundle as a zip, in case the .app
          # itself (not just the DMG) is wanted as a release asset.
          ditto -c -k --sequesterRsrc --keepParent "build/AEGIS_Capture.app" "release_out/AegisCapture-Mac.app.zip"

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.vars.outputs.tag }}
          git push origin ${{ steps.vars.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "AEGIS Capture (macOS) ${{ steps.vars.outputs.tag }}"
          body: |
            Automated build from commit `${{ steps.vars.outputs.sha_short }}` on `main`.
            Signed: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
          files: |
            release_out/AegisCapture-Mac.dmg
            release_out/AegisCapture-Mac.app.zip

      - name: Summary
        run: |
          echo "### AEGIS Capture (macOS) release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: ${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ steps.vars.outputs.sha_short }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: see the Releases page for this repo" >> "$GITHUB_STEP_SUMMARY"
