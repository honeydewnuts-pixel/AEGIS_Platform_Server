databases:
- name: aegis-postgres
  plan: free
  databaseName: aegis
  user: aegis
services:
- type: keyvalue
  name: aegis-redis
  plan: free
  ipAllowList: []
  maxmemoryPolicy: noeviction
- type: web
  name: aegis-api
  runtime: docker
  plan: free
  dockerfilePath: ./docker/Dockerfile
  dockerContext: .
  healthCheckPath: /health
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: aegis-postgres
      property: connectionString
  - key: REDIS_URL
    fromService:
      type: keyvalue
      name: aegis-redis
      property: connectionString
  - key: AEGIS_MASTER_KEY
    sync: false
  - key: ADMIN_BOOTSTRAP_KEY
    sync: false
  - key: SECRET_KEY
    sync: false
  - key: ALLOWED_ORIGINS
    sync: false
  - key: PAYSTACK_SECRET_KEY
    sync: false
  - key: FLUTTERWAVE_SECRET_KEY
    sync: false
  - key: FLUTTERWAVE_WEBHOOK_HASH
    sync: false
  - key: STRIPE_SECRET_KEY
    sync: false
  - key: STRIPE_WEBHOOK_SECRET
    sync: false
  - key: DEBUG
    value: 'False'
  - key: FORCE_ADMIN_KEY_RESET
    value: 'false'
  - key: MAX_CONCURRENT_WORKERS
    value: '100'
